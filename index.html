<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FansNest - Premium Creator Platform</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM for UI logic -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Utilities for hiding scrollbars while keeping functionality */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Safe area for mobile bottom nav */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased selection:bg-pink-500/30">
    <!-- Root element where React will mount the app -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVG Icons ---
        const Home = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        );
        const Bell = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        );
        const MessageCircle = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        );
        const User = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );
        const Heart = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        );
        const Share2 = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
        );
        const MessageSquare = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        );
        const CircleDollarSign = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
        );
        const Lock = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        );
        const MoreHorizontal = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        );
        const ImageIcon = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        );
        const Sparkles = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        );
        const Search = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );
        const PlayCircle = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        );
        const CheckCircle2 = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        );
        const Flame = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12c2 -2.96 0 -7 -1 -8c0 3.038 -1.773 4.741 -3 6c-1.226 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.532 -1.056 -3.94 -2 -5c-1.786 3 -2.791 3 -4 2z" /></svg>
        );
        const Zap = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        );
        const X = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
        );
        const Send = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        );
        const ArrowLeft = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        );
        const Wallet = ({ className = "w-6 h-6", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        );

        const MOCK_LIVE = [
          { id: 'l1', name: 'Lexi Rivers', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80', viewers: '4.2k', type: 'Music Studio' },
          { id: 'l2', name: 'Jayden Fit', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80', viewers: '1.8k', type: 'Workout' },
          { id: 'l3', name: 'Aria Canvas', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80', viewers: '850', type: 'Digital Art' },
          { id: 'l4', name: 'Chef Marcus', avatar: 'https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=150&q=80', viewers: '3.1k', type: 'Cooking' },
          { id: 'l5', name: 'Zara Vibes', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=150&q=80', viewers: '5.6k', type: 'Q&A' },
        ];

        const MOCK_TRENDING = [
          { id: 't1', name: 'Elena Rostova', handle: '@elenacreates', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80', price: 9.99 },
          { id: 't2', name: 'Marcus Chen', handle: '@marcus_fit', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80', price: 14.99 },
          { id: 't3', name: 'Sarah Jenkins', handle: '@sarahjmusic', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=150&q=80', price: 5.99 },
        ];

        const MOCK_POSTS = [
          {
            id: 'p1',
            creator: MOCK_TRENDING[0],
            text: 'Just finished this new piece! What do you guys think? High-res version available for my VIPs. 🎨✨',
            image: 'https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=800&q=80',
            isLocked: false,
            likes: 342,
            comments: 45,
            timestamp: '2 hours ago'
          },
          {
            id: 'p2',
            creator: MOCK_TRENDING[1],
            text: 'My complete 30-day shred program is finally live! Includes meal plans, daily tracking, and 1-on-1 support.',
            image: 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=800&q=80',
            isLocked: true,
            price: 14.99,
            likes: 890,
            comments: 112,
            timestamp: '5 hours ago'
          },
          {
            id: 'p3',
            creator: MOCK_TRENDING[2],
            text: 'Acoustic session from last night. Thanks to everyone who tuned in! 🎸',
            image: 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=80',
            isLocked: false,
            likes: 1205,
            comments: 89,
            timestamp: '1 day ago'
          }
        ];

        const MOCK_CHATS = [
          { id: 'c1', user: MOCK_TRENDING[0], lastMessage: "Thank you for the tip! ❤️", time: "2m ago", unread: 2 },
          { id: 'c2', user: MOCK_LIVE[1], lastMessage: "New workout plan is dropping tomorrow.", time: "1h ago", unread: 0 },
          { id: 'c3', user: MOCK_TRENDING[2], lastMessage: "Yes, I can do a custom song request!", time: "4h ago", unread: 0 },
        ];

        const MOCK_CHAT_MESSAGES = [
           { id: 'm1', senderId: 'c1', text: "Hey! Did you enjoy the latest post? I put a lot of work into the new series.", timestamp: "10:30 AM" },
           { id: 'm2', senderId: 'me', text: "Yes, it was amazing! Sent a small tip to show appreciation.", timestamp: "10:32 AM" },
           { id: 'm3', senderId: 'c1', text: "Thank you for the tip! ❤️ Let me know if you have any requests for the next one.", timestamp: "10:33 AM" },
        ];

        const Avatar = ({ src, alt, size = 'md', className = '' }) => {
          const sizes = { sm: 'w-10 h-10', md: 'w-12 h-12', lg: 'w-16 h-16', xl: 'w-24 h-24' };
          return (
            <img 
              src={src} 
              alt={alt} 
              className={`${sizes[size]} rounded-full object-cover bg-slate-800 ${className}`}
            />
          );
        };

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
          const baseStyle = "px-6 py-2.5 rounded-full font-bold transition-all duration-300 flex items-center justify-center gap-2 transform active:scale-95 cursor-pointer";
          const variants = {
            primary: "bg-gradient-to-r from-blue-600 to-pink-600 hover:from-blue-500 hover:to-pink-500 text-white shadow-[0_0_20px_rgba(236,72,153,0.3)] hover:shadow-[0_0_25px_rgba(236,72,153,0.5)]",
            secondary: "bg-slate-800 hover:bg-slate-700 text-white border border-slate-700",
            outline: "border-2 border-pink-500 text-pink-500 hover:bg-pink-500/10",
            ghost: "text-slate-400 hover:text-white hover:bg-slate-800"
          };
          return (
            <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
              {children}
            </button>
          );
        };

        const NavItem = ({ icon: Icon, label, badge, isActive, onClick }) => (
          <button 
            onClick={onClick}
            className={`w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 group relative cursor-pointer
              ${isActive ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}
            `}
          >
            <div className="relative">
              <Icon className={`w-7 h-7 ${isActive ? 'text-pink-500' : 'group-hover:text-pink-400 transition-colors'}`} />
              {badge && (
                <span className="absolute -top-1 -right-1 w-3 h-3 bg-pink-500 rounded-full border-2 border-slate-950"></span>
              )}
            </div>
            <span className="text-lg hidden xl:block">{label}</span>
          </button>
        );

        const Post = ({ post, onTip }) => {
          const [isLiked, setIsLiked] = useState(false);
          const [likes, setLikes] = useState(post.likes);

          const handleLike = () => {
            setIsLiked(!isLiked);
            setLikes(prev => isLiked ? prev - 1 : prev + 1);
          };

          return (
            <div className="bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-2xl overflow-hidden mb-6 transition-all hover:border-slate-700">
              <div className="p-4 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group">
                  <Avatar src={post.creator.avatar} />
                  <div>
                    <div className="flex items-center gap-1 font-bold text-slate-100 group-hover:text-pink-400 transition-colors">
                      {post.creator.name}
                      <CheckCircle2 className="w-4 h-4 text-blue-400" />
                    </div>
                    <div className="text-sm text-slate-500">{post.timestamp}</div>
                  </div>
                </div>
                <button className="text-slate-500 hover:text-slate-300 p-2 rounded-full hover:bg-slate-800 transition-colors">
                  <MoreHorizontal className="w-5 h-5" />
                </button>
              </div>

              <div className="px-4 pb-3 text-slate-200">
                {post.text}
              </div>

              <div className="relative bg-slate-950 flex items-center justify-center min-h-[300px] max-h-[600px] overflow-hidden">
                {post.image && (
                  <img 
                    src={post.image} 
                    alt="Post content" 
                    className={`w-full max-h-[600px] object-cover transition-all ${post.isLocked ? 'blur-2xl opacity-50 scale-105' : ''}`}
                  />
                )}
                
                {post.isLocked && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10">
                    <div className="w-16 h-16 bg-slate-900/80 backdrop-blur-md rounded-full flex items-center justify-center mb-4 border border-slate-700 shadow-xl">
                      <Lock className="w-7 h-7 text-pink-500" />
                    </div>
                    <h4 className="text-xl font-bold text-white mb-2">Premium Content</h4>
                    <p className="text-slate-300 mb-6 max-w-sm">
                      Subscribe to see this exclusive content and get full access to {post.creator.name}'s feed.
                    </p>
                    <Button className="px-8 py-3 shadow-[0_0_30px_rgba(236,72,153,0.4)]">
                      Subscribe for ${post.price}/mo
                    </Button>
                  </div>
                )}
              </div>

              <div className="p-4 flex flex-col gap-3">
                <div className="flex justify-between items-center">
                  <div className="flex gap-4">
                    <button 
                      onClick={handleLike}
                      className={`flex items-center gap-2 group transition-colors cursor-pointer ${isLiked ? 'text-pink-500' : 'text-slate-400 hover:text-slate-200'}`}
                    >
                      <Heart className={`w-7 h-7 transition-transform duration-300 ${isLiked ? 'fill-current scale-110' : 'group-hover:scale-110'}`} />
                    </button>
                    <button className="text-slate-400 hover:text-slate-200 flex items-center gap-2 group transition-colors cursor-pointer">
                      <MessageCircle className="w-7 h-7 group-hover:scale-110 transition-transform duration-300" />
                    </button>
                    <button onClick={() => onTip && onTip(post.creator)} className="text-slate-400 hover:text-green-400 flex items-center gap-2 group transition-colors cursor-pointer" title="Send Tip">
                      <CircleDollarSign className="w-7 h-7 group-hover:scale-110 transition-transform duration-300" />
                    </button>
                  </div>
                  <button className="text-slate-400 hover:text-slate-200 transition-colors group cursor-pointer">
                    <Share2 className="w-6 h-6 group-hover:scale-110 transition-transform duration-300" />
                  </button>
                </div>
                <div className="font-semibold text-sm text-slate-300">
                  {likes.toLocaleString()} likes
                </div>
              </div>
            </div>
          );
        };

        const TipModal = ({ isOpen, onClose, creator }) => {
          const [amount, setAmount] = useState(10);
          const [isCustom, setIsCustom] = useState(false);
          const [customAmount, setCustomAmount] = useState("");
          
          if (!isOpen) return null;

          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm transition-opacity">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl relative overflow-hidden transform transition-all scale-100 opacity-100">
                <div className="absolute -top-20 -right-20 w-40 h-40 bg-pink-500/20 rounded-full blur-[50px] pointer-events-none"></div>
                
                <div className="flex justify-between items-center mb-6 relative z-10">
                  <h3 className="text-xl font-bold flex items-center gap-2"><Wallet className="w-6 h-6 text-pink-500"/> Send Tip</h3>
                  <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors cursor-pointer"><X className="w-6 h-6" /></button>
                </div>
                
                <div className="flex flex-col items-center mb-6 relative z-10">
                  <Avatar src={creator?.avatar} size="lg" className="mb-3 border-2 border-pink-500 p-0.5 bg-slate-900" />
                  <p className="font-semibold text-lg text-white">Support {creator?.name}</p>
                  <p className="text-sm text-slate-400">@{creator?.name.replace(' ', '').toLowerCase()}</p>
                </div>
                
                <div className="grid grid-cols-3 gap-3 mb-4 relative z-10">
                  {[5, 10, 20, 50, 100].map(val => (
                    <button 
                      key={val} 
                      onClick={() => { setAmount(val); setIsCustom(false); }} 
                      className={`py-3 rounded-xl font-bold border transition-all cursor-pointer ${amount === val && !isCustom ? 'bg-pink-500/20 border-pink-500 text-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.3)]' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-500'}`}
                    >
                      ${val}
                    </button>
                  ))}
                  <button 
                    onClick={() => setIsCustom(true)} 
                    className={`py-3 rounded-xl font-bold border transition-all cursor-pointer ${isCustom ? 'bg-pink-500/20 border-pink-500 text-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.3)]' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-500'}`}
                  >
                    Custom
                  </button>
                </div>

                {isCustom && (
                  <div className="mb-4 relative z-10 transition-all">
                    <div className="relative">
                       <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">$</span>
                       <input 
                         type="number" 
                         value={customAmount}
                         onChange={(e) => setCustomAmount(e.target.value)}
                         placeholder="Enter amount..."
                         className="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-8 pr-4 text-white focus:outline-none focus:border-pink-500 transition-colors"
                       />
                    </div>
                  </div>
                )}
                
                <textarea 
                  placeholder="Add a sweet message... (optional)" 
                  className="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 mb-6 relative z-10 resize-none h-20 transition-colors"
                ></textarea>
                
                <Button className="w-full py-4 text-lg relative z-10 shadow-[0_0_20px_rgba(236,72,153,0.4)]" onClick={onClose}>
                  Send ${(isCustom ? customAmount : amount) || 0} Tip
                </Button>
              </div>
            </div>

                      <Sparkles className="w-6 h-6" />
                    </div>
                  </button>
                  <button onClick={() => setCurrentTab('notifications')} className={`p-2 relative transition-colors cursor-pointer ${currentTab === 'notifications' ? 'text-pink-500' : 'text-slate-500'}`}>
                    <Bell className="w-6 h-6" />
                    <span className="absolute top-2 right-2 w-2 h-2 bg-pink-500 rounded-full"></span>
                  </button>
                  <button onClick={() => setCurrentTab('profile')} className={`p-2 transition-colors cursor-pointer ${currentTab === 'profile' ? 'text-pink-500' : 'text-slate-500'}`}>
                    <User className="w-6 h-6" />
                  </button>
                </div>
              </nav>

              <TipModal 
                isOpen={isTipModalOpen} 
                onClose={() => setIsTipModalOpen(false)} 
                creator={selectedCreatorForTip} 
              />
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
